name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de uma release existente (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validar release publicada
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName --jq 'select(.isDraft == false and .isPrerelease == false) | .tagName' | grep -Fx -- "$TAG"
  production:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Promover release existente como Latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName | grep -Fx -- "$TAG"
          echo "Release promovida: $TAG" >> "$GITHUB_STEP_SUMMARY"
